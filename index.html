<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ساحل | BAGHLANHERO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:#0b1720;color:white}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100%;height:100%;max-width:900px;overflow:hidden;background:linear-gradient(#78c8ef 0%,#c9edff 48%,#7dbd62 49%,#3f7d3a 100%)}
.sky{position:absolute;inset:0;background:
radial-gradient(circle at 75% 18%,rgba(255,255,255,.85) 0 6%,transparent 6.5%),
linear-gradient(180deg,#55b9eb 0%,#c9efff 57%,#91c86b 58%,#467f3e 100%)}
.mountain{position:absolute;bottom:28%;width:0;height:0;border-left:190px solid transparent;border-right:190px solid transparent;border-bottom:260px solid #476b56;filter:drop-shadow(0 12px 0 rgba(0,0,0,.08))}
.m1{left:-110px}.m2{left:28%;bottom:27%;border-left-width:230px;border-right-width:230px;border-bottom-color:#55775f}
.m3{right:-120px;bottom:29%;border-left-width:220px;border-right-width:220px;border-bottom-color:#3f6250}
.road{position:absolute;bottom:-5%;left:20%;width:60%;height:62%;background:#6f6758;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.95}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:5}
.badge{background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.2);padding:9px 12px;border-radius:14px;font-size:14px;backdrop-filter:blur(5px)}
#player{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);font-size:62px;z-index:4;filter:drop-shadow(0 7px 5px rgba(0,0,0,.35))}
.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:6}
button{border:0;border-radius:18px;background:rgba(0,0,0,.55);color:white;font-size:25px;width:70px;height:58px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
button:active{transform:scale(.94)}
#start{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,20,27,.55);backdrop-filter:blur(3px)}
.panel{width:min(90%,420px);padding:28px;border-radius:25px;background:rgba(10,25,32,.88);text-align:center;border:1px solid rgba(255,255,255,.18)}
h1{margin:0 0 8px;font-size:34px}
p{line-height:1.9;color:#d9edf2}
.startbtn{width:100%;background:#1d8f59;font-size:20px;margin-top:10px}
#msg{position:absolute;top:75px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.5);padding:8px 14px;border-radius:12px;display:none}
</style>
</head>
<body>
<div id="game">
  <div class="sky"></div>
  <div class="mountain m1"></div>
  <div class="mountain m2"></div>
  <div class="mountain m3"></div>
  <div class="road"></div>

  <div class="hud">
    <div class="badge">🏔️ BAGHLANHERO</div>
    <div class="badge">امتیاز: <span id="score">0</span></div>
  </div>

  <div id="msg">آفرین ساحل! 👏</div>
  <div id="player">🏃</div>

  <div class="controls">
    <button id="right">➡️</button>
    <button id="jump">⬆️</button>
    <button id="left">⬅️</button>
  </div>

  <div id="start">
    <div class="panel">
      <h1>ساحل</h1>
      <p>به <b>BAGHLANHERO</b> خوش آمدی!<br>در مسیرهای زیبای بغلان حرکت کن و امتیاز جمع کن.</p>
      <button class="startbtn" id="play">شروع بازی 🎮</button>
    </div>
  </div>
</div>

<script>
const player=document.getElementById('player');
const scoreEl=document.getElementById('score');
const start=document.getElementById('start');
const msg=document.getElementById('msg');
let x=50, score=0, running=false, jumpTimer;

function move(dx){
  if(!running)return;
  x=Math.max(20,Math.min(80,x+dx));
  player.style.left=x+'%';
  score++;
  scoreEl.textContent=score;
  if(score%10===0){msg.style.display='block';setTimeout(()=>msg.style.display='none',900)}
}
function jump(){
  if(!running)return;
  player.style.transition='bottom .22s ease';
  player.style.bottom='32%';
  clearTimeout(jumpTimer);
  jumpTimer=setTimeout(()=>player.style.bottom='16%',260);
  score+=2; scoreEl.textContent=score;
}
document.getElementById('left').onclick=()=>move(-5);
document.getElementById('right').onclick=()=>move(5);
document.getElementById('jump').onclick=jump;
document.getElementById('play').onclick=()=>{running=true;start.style.display='none'};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-5);
 if(e.key==='ArrowRight')move(5);
 if(e.key==='ArrowUp'||e.key===' ')jump();
});
</script>
</body>
</html>
